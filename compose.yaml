services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - workshop_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/workshops/')"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  workshop_data:
